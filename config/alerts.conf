# ==============================================================================
# Linux Admin Scripts - Global Configuration & Thresholds
# config/alerts.conf
#
# Sourced automatically by scripts in bin/. Can be overridden via command-line flags.
# ==============================================================================

# ------------------------------------------------------------------------------
# Resource Alert Thresholds (Percentage 0-100)
# ------------------------------------------------------------------------------
# CPU percentage or load average factor (multiplier of total CPU cores)
CPU_WARN_THRESHOLD=75
CPU_CRIT_THRESHOLD=90

# Memory usage thresholds (% of total physical RAM)
MEM_WARN_THRESHOLD=80
MEM_CRIT_THRESHOLD=95

# Disk partition usage (% of total partition capacity)
DISK_WARN_THRESHOLD=80
DISK_CRIT_THRESHOLD=90

# ------------------------------------------------------------------------------
# Backup Engine Defaults
# ------------------------------------------------------------------------------
# Default target backup directory if -d flag is omitted
DEFAULT_BACKUP_DEST="/var/backups"

# Default retention window in days for pruning older backup archives
BACKUP_RETENTION_DAYS=7

# Compression algorithm: gzip (.tar.gz), bzip2 (.tar.bz2), or xz (.tar.xz)
BACKUP_COMPRESSION="gzip"

# ------------------------------------------------------------------------------
# Log Manager Defaults
# ------------------------------------------------------------------------------
# Size threshold (in megabytes) before rotating active log files
LOG_ROTATION_SIZE_MB=50

# Log archive retention period in days
LOG_RETENTION_DAYS=14

# ------------------------------------------------------------------------------
# Notification & Webhooks
# ------------------------------------------------------------------------------
# Webhook URL for Slack, Discord, or generic endpoint notifications.
# Leave empty to keep notifications local (logged to stdout/file only).
# Example: "https://discord.com/api/webhooks/..." or "https://hooks.slack.com/services/..."
WEBHOOK_URL=""

# Toggle notifications on/off globally (true/false)
NOTIFICATION_ENABLED=true

# ------------------------------------------------------------------------------
# Operational Paths
# ------------------------------------------------------------------------------
# Directory where service and metric logs are persisted
LOG_DIR="/var/log/linux-admin-scripts"
